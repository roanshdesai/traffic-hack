[project]
name = "busplanner"
version = "0.1.0"
description = "Delhi bus crowding-aware journey planner: data pipeline and journey API (prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
busplanner = "busplanner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["busplanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
